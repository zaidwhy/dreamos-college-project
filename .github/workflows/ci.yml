name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - run: pytest backend/tests -q
        env:
          PYTHONUTF8: "1"
